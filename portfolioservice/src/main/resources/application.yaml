spring:
  application:
    name: portfolioservice

  datasource:
    url: "jdbc:mysql://localhost:3306/STP_PORTFOLIO?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=UTC"
    username: root
    password: "#Sampad009"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect



  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: portfolio-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.HashMap

#    producer:
#      key-serializer: org.apache.kafka.common.serialization.StringSerializer
#      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer


server:
  port: 8084


market:
  service:
    url: http://localhost:8082

management:
  endpoints:
    web:
      exposure:
        include: health,info